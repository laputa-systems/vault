[package]
name = "vault"
version = "0.2.0"
edition = "2024"

[dependencies]
security-framework = "3"
security-framework-sys = "2"
rustix = { version = "1", features = ["termios"] }
core-foundation = "0.10"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 2
strip = true
