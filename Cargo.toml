[package]
name = "vault"
version = "0.2.0"
edition = "2024"

[dependencies]
rustix = { version = "1", features = ["fs", "termios"] }

[target.'cfg(target_os = "macos")'.dependencies]
age = { version = "0.12.1", default-features = false }
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
age = { version = "0.12.1", default-features = false }
libc = "0.2"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["process", "stdio"] }

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 2
strip = true
