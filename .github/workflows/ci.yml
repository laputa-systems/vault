name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  mutants-plan:
    name: Plan mutation shards
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, tomllib
          with open('.cargo/mutants-gate.toml', 'rb') as config:
              shards = tomllib.load(config)['shards']
          if type(shards) is not int or not 1 <= shards <= 32:
              raise SystemExit('invalid shard count')
          jobs = [{'platform': platform, 'runner': runner, 'shard': shard}
                  for platform, runner in [('linux', 'ubuntu-26.04-arm'), ('macos', 'xcode-27')]
                  for shard in range(shards)]
          print('matrix=' + json.dumps({'include': jobs}, separators=(',', ':')))
          PY

  mutants:
    name: mutants (${{ matrix.platform }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: mutants-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutants-plan.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      - name: Select Python for the mutation gate
        run: |
          uv python install 3.15
          dirname "$(uv python find --managed-python 3.15)" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-mutants@27.1.0
      - name: Install pinned age interoperability tool
        if: matrix.platform == 'linux'
        run: |
          sh scripts/install-rage.sh "$PWD/.work/tools/bin"
          echo "$PWD/.work/tools/bin" >> "$GITHUB_PATH"
      - name: mutants
        env:
          BASE_REF: ${{ github.base_ref }}
          RUST_TEST_THREADS: 1
          CARGO_BUILD_JOBS: 1
          MUTANTS_PLATFORM: ${{ matrix.platform }}
          MUTANTS_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p .work/tmp
          export TMPDIR="$PWD/.work/tmp"
          make mutants-diff BASE="origin/$BASE_REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-evidence-${{ matrix.platform }}-${{ matrix.shard }}
          path: .work/mutants-gate/
          include-hidden-files: true

  macos:
    name: Test (macOS)
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      - name: Select Python for the mutation gate
        run: |
          uv python install 3.15
          dirname "$(uv python find --managed-python 3.15)" >> "$GITHUB_PATH"
      - name: Test and lint
        run: |
          mkdir -p .work/tmp
          export TMPDIR="$PWD/.work/tmp"
          make test lint mutants-selftest

  linux-musl:
    name: Test (Linux ${{ matrix.arch }} musl)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - arch: ARM64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Linux image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: vault-builder:${{ matrix.target }}
          cache-from: type=gha,scope=vault-${{ matrix.target }}
      - name: Lint in image
        run: |
          docker run --rm --init \
            --platform "${{ matrix.platform }}" \
            -e CI \
            -v "$GITHUB_WORKSPACE:/vault" \
            -w /vault \
            vault-builder:${{ matrix.target }} \
            sh -ec '
              cargo clippy --all-targets --all-features -- --deny warnings
            '
      - name: Test in image
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: vault-builder:${{ matrix.target }}
        run: make test-ci

  ci:
    name: CI
    needs: [linux-musl, macos, mutants-plan, mutants]
    if: always()
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Require every verification lane
        env:
          LINUX_RESULT: ${{ needs.linux-musl.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          MUTANTS_RESULT: ${{ needs.mutants.result }}
          MUTANTS_PLAN_RESULT: ${{ needs.mutants-plan.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$MUTANTS_PLAN_RESULT" = success
          test "$MUTANTS_RESULT" = success
