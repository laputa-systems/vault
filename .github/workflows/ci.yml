name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  linux-musl:
    name: Test (Linux ${{ matrix.arch }} musl)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - arch: ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Linux image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: vault-builder:${{ matrix.target }}
          cache-from: type=gha,scope=vault-${{ matrix.target }}
      - name: Lint and test in image
        run: |
          docker run --rm --init \
            --platform "${{ matrix.platform }}" \
            -e CI \
            -v "$GITHUB_WORKSPACE:/vault" \
            -w /vault \
            vault-builder:${{ matrix.target }} \
            sh -ec '
              cargo clippy --all-targets --all-features -- --deny warnings
              cargo test
            '

  ci:
    name: CI
    needs: linux-musl
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - run: echo "Linux musl matrix passed"
